name: Deploy to AWS App Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 手動トリガーも可能

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: lpic-ccna-app
  APP_RUNNER_SERVICE_NAME: lpic-ccna-app

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC認証に必要
      contents: read

    steps:
      # ── 1. コードチェックアウト ──────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. AWS 認証（OIDC 推奨 / アクセスキー不要） ──────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 3. ECR ログイン ─────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Docker ビルド & ECR プッシュ ─────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_ID="${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}" \
            --build-arg NEXT_PUBLIC_COGNITO_CLIENT_ID="${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_SUBMIT_ANSWER_URL="${{ secrets.NEXT_PUBLIC_SUBMIT_ANSWER_URL }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── 5. App Runner サービスを更新 ─────────────────────────
      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: ${{ env.APP_RUNNER_SERVICE_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          access-role-arn: ${{ secrets.APP_RUNNER_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}
          cpu: 0.25
          memory: 0.5
          wait-for-service-stability: true

      - name: App Runner URL
        run: |
          echo "✅ デプロイ完了!"
          echo "App Runner URL: ${{ steps.deploy-apprunner.outputs.service-url }}"
